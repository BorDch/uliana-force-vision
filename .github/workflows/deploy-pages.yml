name: Deploy ULIANA prototype

on:
  push:
    branches: [main]
    paths:
      - "uliana-demo/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: uliana-demo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: uliana-demo/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build static site
        env:
          STATIC_ASSET_PREFIX: /${{ github.event.repository.name }}
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build:static

      # The static export mirrors the asset prefix to disk (dist/client/<repo>/_next).
      # A project Pages site already lives under /<repo>/, so publish _next at the
      # artifact root to avoid a doubled /<repo>/<repo>/ path.
      - name: Flatten asset prefix directory
        shell: bash
        run: |
          prefix="dist/client/${{ github.event.repository.name }}"
          if [ -d "$prefix/_next" ]; then
            rm -rf dist/client/_next
            mv "$prefix/_next" dist/client/_next
            rmdir "$prefix"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: uliana-demo/dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
