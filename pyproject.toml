[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uliana-force-vision"
version = "0.1.0"
description = "Deterministic toy experiments for the ULIANA force-and-pose MVP"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
video = ["mediapipe==0.10.35", "opencv-contrib-python>=4.10"]
demo = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "python-multipart>=0.0.12"]
tts = ["kokoro==0.9.4", "soundfile>=0.12", "httpx[socks]>=0.28", "requests[socks]>=2.31"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
